<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Day 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>
    
    <!-- BS-5 Buttons -->

    <button class="btn btn-success">Click me</button>

    <a href="#" class="btn btn-danger">Button</a>

    <input type="button" value="Primary btn" class="btn btn-primary">

    <input type="submit" class="btn btn-secondary">

    <input type="reset" class="btn btn-info">

    <br><br><br>
    <!-- btn  -->

    <button class="btn btn-info btn-sm">Small</button>
    <button class="btn btn-info">Default</button>
    <button class="btn btn-info btn-lg">Large</button>

    <br><br><br>

    <!-- btn-block -->

    <div class="d-grid">
        <button class="btn btn-primary btn-block">Block1</button>
    </div>

    <br><br><br>

    <div class="d-grid gap-3">
        <button class="btn btn-block btn-info">Block 1</button>
        <button class="btn btn-block btn-info">Block 2</button>
        <button class="btn btn-block btn-info">Block 3</button>
    </div>

    <br><br><br><br>

    <button class="btn btn-primary">
        <span class="spinner-grow"></span>
        Waiting...
    </button>
    <button class="btn btn-primary">
        <span class="spinner-grow spinner-grow-sm"></span>
        Waiting...
    </button>

    <br><br>

    <button class="btn btn-warning">
        <span class="spinner-border"></span>
        Loading...
    </button>
    <button class="btn btn-warning">
        <span class="spinner-border spinner-border-sm"></span>
        Loading...
    </button>

    <br><br><br><br><br>

    <div class="btn-group">
        <button class="btn btn-secondary">Home</button>
        <button class="btn btn-secondary">About</button>
        <button class="btn btn-secondary">Contact</button>
    </div>

    <br><br>

    <div class="btn-group">
        <button class="btn btn-danger">Red</button>
        <button class="btn btn-warning">Yellow</button>
        <button class="btn btn-success">Green</button>
    </div>
</body>
</html>
