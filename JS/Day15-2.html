<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 15-2 JavaScript</title>
</head>
<body>
    <h3>Student Form</h3>

    <form>
        <label for="fName">User Name: </label>
        <input type="text" required placeholder="first name" id="fName"><br><br>
        <label>Email: </label>
        <input type="email" required placeholder="abc@123.com" id="email"><br><br>
        <label>Password: </label>
        <input type="password" id="pass"><br><br>

        <label>Date of Birth: </label>
        <input type="date" id="dob"><br><br>

        <button onclick="formFunc(event)" type="submit">Submit</button>


        <script src="Day15-2.js"></script>
    </form>
    <table id="data-table" border="1">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>DOB</th>
        </tr>
    </table>
</body>
</html>
